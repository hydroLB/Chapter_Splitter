<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Chapter Splitter workflow</title>
  <desc id="desc">Animated flow from source PDF to chapter detection, review, and export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1117"/>
      <stop offset="0.55" stop-color="#111926"/>
      <stop offset="1" stop-color="#102015"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c88d9"/>
      <stop offset="0.5" stop-color="#8cdba2"/>
      <stop offset="1" stop-color="#ffd787"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 22px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f8ff; }
      .small { font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a9b8c8; }
      .tiny { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d4e2; }
      .panel { fill: #141f2d; stroke: #2f455d; stroke-width: 1.5; }
      .inner { fill: #0f1823; stroke: #324960; stroke-width: 1; }
      .accent { stroke: url(#line); stroke-width: 5; stroke-linecap: round; fill: none; stroke-dasharray: 34 18; animation: route 2.6s linear infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .card1 { animation: card1 5.2s ease-in-out infinite; }
      .card2 { animation: card2 5.2s ease-in-out infinite; }
      .card3 { animation: card3 5.2s ease-in-out infinite; }
      @keyframes route { to { stroke-dashoffset: -52; } }
      @keyframes scan {
        0%, 18% { transform: translateY(0); opacity: .25; }
        45%, 55% { transform: translateY(138px); opacity: 1; }
        82%, 100% { transform: translateY(0); opacity: .25; }
      }
      @keyframes pulse {
        0%, 65%, 100% { transform: scale(1); opacity: .72; }
        76%, 88% { transform: scale(1.035); opacity: 1; }
      }
      @keyframes card1 {
        0%, 20% { transform: translateX(-8px); opacity: .35; }
        34%, 100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes card2 {
        0%, 34% { transform: translateX(-8px); opacity: .35; }
        48%, 100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes card3 {
        0%, 48% { transform: translateX(-8px); opacity: .35; }
        62%, 100% { transform: translateX(0); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .accent, .scan, .pulse, .card1, .card2, .card3 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="372" rx="22" fill="none" stroke="#24374c"/>

  <path class="accent" d="M296 210 H390 C430 210 430 210 470 210 H530 C570 210 570 210 610 210 H684 C724 210 724 210 764 210 H858"/>

  <g transform="translate(62 72)">
    <rect class="panel" width="238" height="276" rx="16"/>
    <text class="label" x="26" y="44">Source PDF</text>
    <text class="small" x="26" y="72">open in desktop preview</text>
    <rect class="inner" x="50" y="100" width="138" height="146" rx="8" fill="#ffffff"/>
    <path d="M72 136 H166 M72 166 H154 M72 196 H176" stroke="#5b6c7d" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 118 H188" stroke="#2b77c7" stroke-width="8" stroke-linecap="round"/>
    <rect class="scan" x="50" y="106" width="138" height="9" rx="4.5" fill="#8cdba2" opacity=".85" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(374 72)">
    <rect class="panel" width="238" height="276" rx="16"/>
    <text class="label" x="26" y="44">Auto Detect</text>
    <text class="small" x="26" y="72">outlines first, TOC fallback</text>
    <rect class="inner" x="32" y="104" width="174" height="126" rx="12"/>
    <path d="M58 134 H182" stroke="#3c88d9" stroke-width="8" stroke-linecap="round"/>
    <path d="M58 166 H152" stroke="#8cdba2" stroke-width="8" stroke-linecap="round"/>
    <path d="M58 198 H170" stroke="#ffd787" stroke-width="8" stroke-linecap="round"/>
    <circle class="pulse" cx="190" cy="134" r="10" fill="#3c88d9"/>
    <circle class="pulse" cx="162" cy="166" r="10" fill="#8cdba2"/>
    <circle class="pulse" cx="180" cy="198" r="10" fill="#ffd787"/>
  </g>

  <g transform="translate(686 72)">
    <rect class="panel" width="238" height="276" rx="16"/>
    <text class="label" x="26" y="44">Review</text>
    <text class="small" x="26" y="72">edit titles and ranges</text>
    <g class="card1">
      <rect class="inner" x="30" y="106" width="178" height="36" rx="8"/>
      <text class="tiny" x="48" y="130">Intro</text>
      <text class="tiny" x="158" y="130">1-2</text>
    </g>
    <g class="card2">
      <rect class="inner" x="30" y="154" width="178" height="36" rx="8"/>
      <text class="tiny" x="48" y="178">Workflow</text>
      <text class="tiny" x="150" y="178">6-8</text>
    </g>
    <g class="card3">
      <rect class="inner" x="30" y="202" width="178" height="36" rx="8"/>
      <text class="tiny" x="48" y="226">Export</text>
      <text class="tiny" x="144" y="226">11-12</text>
    </g>
  </g>

  <g transform="translate(998 72)">
    <rect class="panel" width="140" height="276" rx="16"/>
    <text class="label" x="26" y="44">Export</text>
    <text class="small" x="26" y="72">PDFs + TOML</text>
    <g class="pulse">
      <rect x="38" y="110" width="64" height="80" rx="8" fill="#edf9f0" stroke="#8cdba2"/>
      <path d="M54 140 H88 M54 164 H82" stroke="#1f6d34" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g class="pulse" style="animation-delay: .35s">
      <rect x="28" y="202" width="84" height="34" rx="8" fill="#132744" stroke="#355982"/>
      <text class="tiny" x="48" y="224">TOML</text>
    </g>
  </g>
</svg>
