name: Feature request
description: Propose an enhancement with clear scope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and success criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List other options and why they are less suitable.
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Note migration, rollout, or compatibility concerns.
