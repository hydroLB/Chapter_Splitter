name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-bundle.txt
            pyproject.toml
      - name: Install dependencies
        run: make install-dev
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Import boundaries
        run: make boundaries
      - name: Dependency policy
        run: make deps-policy
      - name: Repository hygiene
        run: make repo-hygiene
      - name: Docstring standards
        run: make docstrings
      - name: Tests
        run: make test
      - name: Build coverage artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ".coverage" ]]; then
            .venv/bin/python -m coverage xml -o coverage.xml
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: warn
      - name: Security scan
        run: make security
      - name: Release discipline
        run: make release-check
      - name: Build package
        id: build_package
        run: make build
      - name: Verify built wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"

          python -m venv /tmp/chapter-splitter-wheel
          /tmp/chapter-splitter-wheel/bin/python -m pip install "${wheel_path}"
          /tmp/chapter-splitter-wheel/bin/chapter-splitter --help >/dev/null
          /tmp/chapter-splitter-wheel/bin/python - <<'PY'
          from importlib.resources import files

          assert files("chapter_splitter").joinpath("py.typed").is_file()
          PY

          if gui_output="$(/tmp/chapter-splitter-wheel/bin/chapter-splitter-gui 2>&1)"; then
            echo "chapter-splitter-gui unexpectedly succeeded without desktop dependencies" >&2
            exit 1
          fi
          grep -F ".[desktop]" <<<"${gui_output}"
      - name: Upload build artifact
        if: ${{ success() && steps.build_package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-dist
          path: dist/*
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gacts/gitleaks@7f2df3bc5fcf5223ae00c23e0f9311d66a157f9d # v1

  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0
      - name: Install desktop test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e '.[desktop]'
      - name: Run headless desktop and Qt behavior tests
        run: |
          python -m pytest -q \
            tests/e2e/test_gui_smoke.py \
            tests/unit/test_chapters_table_qt.py \
            tests/unit/test_qt_workers.py \
            tests/unit/test_qt_workflow_actions_async.py

  standalone-bundle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0
      - name: Install bundle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[bundle]'
      - name: Build and smoke-test Ubuntu GUI and CLI bundles
        run: python scripts/bundle_pyinstaller.py --target both
