name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: make install-dev
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Import boundaries
        run: make boundaries
      - name: Detect touched UI/workflow files
        id: touched_ui_workflow
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-count=1 HEAD^ || true)"
          fi

          if [[ -z "${base_sha}" ]]; then
            git ls-files > /tmp/changed_files.txt
          else
            git diff --name-only "${base_sha}" "${GITHUB_SHA}" > /tmp/changed_files.txt
          fi

          awk '/^Chapter_Splitter\/chapter_splitter\/ui\/qt\/.*\.py$/' \
            /tmp/changed_files.txt > /tmp/touched_ui_workflow_files.txt || true

          file_count="$(wc -l < /tmp/touched_ui_workflow_files.txt | tr -d ' ')"
          if [[ "${file_count}" -gt 0 ]]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            tr '\n' '\0' < /tmp/touched_ui_workflow_files.txt > /tmp/touched_ui_workflow_files.nul
            echo "Touched UI/workflow files:"
            cat /tmp/touched_ui_workflow_files.txt
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            : > /tmp/touched_ui_workflow_files.nul
            echo "No touched UI/workflow files detected."
          fi
      - name: Touched UI/workflow warning gate
        if: steps.touched_ui_workflow.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xargs -0 ruff check --select W < /tmp/touched_ui_workflow_files.nul
          xargs -0 mypy --config-file pyproject.toml < /tmp/touched_ui_workflow_files.nul
      - name: Tests
        run: make test
      - name: Build coverage artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ".coverage" ]]; then
            coverage xml -o coverage.xml
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: warn
      - name: Security scan
        run: make security
      - name: Release discipline
        run: make release-check
      - name: Build package
        run: make build
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-dist
          path: dist/*
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
