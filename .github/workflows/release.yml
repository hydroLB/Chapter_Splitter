name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Verify tag and project version
        run: python scripts/check_release_discipline.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --title "PDF Chapter Splitter ${GITHUB_REF_NAME}"

  bundle:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-arm64
          - os: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0
      - name: Install bundle dependencies
        run: python -m pip install -e ".[bundle]"
      - name: Build and smoke-test desktop and CLI executables
        run: python scripts/bundle_pyinstaller.py --target both --onefile
      - name: Package Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="PDF-Chapter-Splitter-${version}-${{ matrix.asset }}.tar.gz"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            asset="PDF-Chapter-Splitter-${version}-${{ matrix.asset }}.zip"
            ditto -c -k --sequesterRsrc --keepParent dist/pyinstaller/ChapterSplitter.app "${asset}"
            zip -j "${asset}" dist/pyinstaller/chapter-splitter
          else
            tar -czf "${asset}" -C dist/pyinstaller ChapterSplitter chapter-splitter
          fi
          shasum -a 256 "${asset}" > "${asset}.sha256"
      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "PDF-Chapter-Splitter-$version-${{ matrix.asset }}.zip"
          Compress-Archive -Path dist/pyinstaller/ChapterSplitter.exe,dist/pyinstaller/chapter-splitter.exe -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" PDF-Chapter-Splitter-* --clobber

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
