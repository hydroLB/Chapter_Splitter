version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "pypdf"
    groups:
      python-runtime:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
