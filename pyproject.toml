[build-system]
requires = ["setuptools==70.0.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-splitter"
version = "0.1.0"
description = "Split a PDF into chapter files with a focused desktop workflow."
readme = "README.MD"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Leon Bouramia" }]
dependencies = [
  "pypdf==6.6.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.7.9",
  "build==1.2.1",
  "coverage==7.5.1",
  "mypy==1.10.0",
  "pip-audit==2.7.3",
  "pre-commit==3.7.0",
  "pytest==8.2.1",
  "ruff==0.4.4",
]

[project.scripts]
chapter-splitter = "chapter_splitter.cli:main"
chapter-splitter-gui = "chapter_splitter.app:main"

[tool.setuptools]
package-dir = {"" = "Chapter_Splitter"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["Chapter_Splitter"]
include = ["chapter_splitter", "chapter_splitter.*"]

[tool.setuptools.package-data]
"chapter_splitter.config" = ["settings.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "typings"
files = ["Chapter_Splitter", "tests", "scripts"]

[tool.ruff]
line-length = 100
src = ["Chapter_Splitter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["Chapter_Splitter/chapter_splitter"]
omit = [
  "Chapter_Splitter/chapter_splitter/__main__.py",
  "Chapter_Splitter/chapter_splitter/app.py",
  "Chapter_Splitter/chapter_splitter/ui/*",
  "Chapter_Splitter/chapter_splitter/utils/viewer.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.bandit]
skips = ["B101"]
