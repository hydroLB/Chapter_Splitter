[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-splitter"
version = "0.1.0"
description = "Split a PDF into chapter files with a focused desktop workflow."
readme = "README.MD"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leon Bouramia" }]
keywords = ["pdf", "chapters", "desktop", "cli", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]
dependencies = [
  "pypdf==6.16.2",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.6.0",
  "coverage==7.16.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.5",
]
bundle = [
  "PySide6==6.11.2",
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.7",
]
desktop = [
  "PySide6==6.11.2",
]

[project.scripts]
chapter-splitter = "chapter_splitter.cli:main"

[project.gui-scripts]
chapter-splitter-gui = "chapter_splitter.app:main"

[project.urls]
Repository = "https://github.com/hydroLB/Chapter_Splitter"
Issues = "https://github.com/hydroLB/Chapter_Splitter/issues"

[tool.setuptools]
package-dir = {"" = "Chapter_Splitter"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["Chapter_Splitter"]
include = ["chapter_splitter", "chapter_splitter.*"]

[tool.setuptools.package-data]
"chapter_splitter" = ["py.typed"]
"chapter_splitter.config" = ["settings.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
incremental = false
mypy_path = "typings"
files = ["Chapter_Splitter", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pkg_resources"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["Chapter_Splitter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["Chapter_Splitter/chapter_splitter"]
omit = [
  "Chapter_Splitter/chapter_splitter/__main__.py",
  "Chapter_Splitter/chapter_splitter/ui/qt/*",
  "Chapter_Splitter/chapter_splitter/utils/viewer.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.bandit]
skips = ["B101"]
