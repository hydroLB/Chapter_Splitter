# Central configuration for PDF Chapter Splitter.
# Update this file or provide an override at CHAPTER_SPLITTER_CONFIG.

[app]
title = "PDF Chapter Splitter"
environment = "local"
correlation_id_prefix = "chapter-splitter"

[logging]
level = "INFO"
formatter = "json"
console_enabled = true
file_enabled = true
file_path = "splitter.log"
redact_keys = ["password", "secret", "token", "api_key"]
redact_values = ["password", "secret", "token", "api_key"]

[io]
open_viewer = true
viewer_timeout_seconds = 5.0
pdf_read_timeout_seconds = 30.0
pdf_write_timeout_seconds = 30.0
operation_timeout_seconds = 120.0
output_dir_suffix = "_chapters"
output_collision_policy = "error"
output_collision_max_suffix = 250
fsync_writes = false
page_offset = 0
infer_page_offset_from_labels = false
infer_page_offset_min_sequential_numeric_labels = 3

[retry]
max_attempts = 3
initial_delay_seconds = 0.2
max_delay_seconds = 2.0
jitter_ratio = 0.1

[ui]
window_width = 1100
window_height = 720
window_offset_x = 900
window_offset_y = 100
open_pdf_button_label = "Open in System Viewer"
close_button_label = "Done"
row_limit = 60
base_height = 420
row_height = 36
height_threshold_rows = 8
rows_per_column = 60
column_widths = [640]
header_rows = 1
grid_columns = 4
grid_entry_width = 6
grid_remove_button_width = 2
grid_padding_x = 4
grid_padding_y = 3
grid_frame_padding_x = 10
grid_frame_padding_y = 10
grid_header_labels = ["Chapter", "Start", "End", ""]
undo_button_label = "Undo"
remove_button_label = "✕"
add_button_label = "Add"
auto_detect_button_label = "Auto Detect"
auto_detect_on_open = true
export_button_label = "Export"
chapter_title_prefix = "Chapter"
no_chapters_title = "No Chapters Found"
no_chapters_message = "This PDF does not contain usable outline metadata."
error_dialog_title = "Error"
success_dialog_title = "Success"
success_dialog_message_template = "Created {count} chapter file(s) in:\\n{output_dir}"
auto_open_viewer = false
action_rate_limit_seconds = 0.8
chapter_window_title = "Define Chapters"
file_dialog_title = "Select PDF to Split"
button_row_padding = 2
button_gap_padding = 8
export_button_padding = 10
confirm_auto_detect_overwrite = true
confirm_auto_detect_overwrite_title = "Replace Current Chapters?"
confirm_auto_detect_overwrite_message = "Auto Detect will replace the current chapter list. Continue?"
prompt_open_output_dir_after_export = true
open_output_dir_prompt_title = "Export Complete"
open_output_dir_prompt_message_template = "Created {count} chapter file(s) in:\\n{output_dir}\\n\\nOpen the output folder now?"
enable_keyboard_shortcuts = true
show_status_bar = false
status_hint = ""
color_mode = "auto"
enable_pdf_preview = true
pdf_preview_zoom = 1.0
pdf_preview_fit_mode = "width"
pdf_preview_fit_padding_px = 18
pdf_preview_continuous_scroll = true
pdf_preview_supersample = 2
pdf_preview_min_zoom = 0.25
pdf_preview_max_zoom = 4.0
pdf_preview_zoom_step = 0.1
pdf_preview_cache_entries = 8
pdf_preview_render_timeout_seconds = 2.0
chapter_review_thumbnail_width = 260
chapter_review_columns = 2
auto_show_review_after_detect = true

[validation]
max_chapters = 60
require_unique_titles = true
sort_chapters_by_start_page = true
reject_overlapping_ranges = true

[detection]
enable_toc_fallback = true
toc_auto_scan_max_start_page = 12
toc_scan_max_pages = 5
toc_entry_regexes = [
  "^(?P<title>.+?)\\s+\\.{2,}\\s*(?P<page>\\d+)\\s*$",
  "^(?P<title>.+?)\\s+(?P<page>\\d+)\\s*$",
]
toc_ignore_title_regexes = [
  "(?i)^(table of contents|contents)$",
]
toc_min_entries = 2
toc_max_entries = 120
outline_ignore_title_regexes = []
outline_min_depth = 0
outline_merge_tiny_max_pages = 0
outline_merge_tiny_title_joiner = " + "

[performance]
benchmark_iterations = 5
benchmark_budget_seconds = 1.0
