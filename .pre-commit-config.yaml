repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.2.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies: ["pypdf==6.16.0", "pytest==9.0.3"]
  - repo: local
    hooks:
      - id: dependency-policy
        name: dependency-policy
        entry: bash scripts/run_with_repo_python.sh scripts/check_dependency_policy.py
        language: system
        pass_filenames: false
      - id: repo-hygiene
        name: repo-hygiene
        entry: bash scripts/run_with_repo_python.sh scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
      - id: docstring-standards
        name: docstring-standards
        entry: bash scripts/run_with_repo_python.sh scripts/check_docstring_standards.py
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets in repository history
        entry: gitleaks git --redact --verbose .
        pass_filenames: false
        always_run: true
        stages: [manual, pre-push]
